services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budokan-be-app
    restart: always
    tty: true
    stdin_open: true
    # Sem publicar porta: o SWAG chega aqui pela rede swag_default (alias budokan-be).
    # Segredos e config vêm do .env (fora do git). Ver .env.example para o formato.
    env_file: .env
    environment:
      - NODE_OPTIONS=--no-warnings
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      budokan-network:
      # alias unico: "app" colidiria com o servico "app" de outros projetos
      swag_default:
        aliases:
          - budokan-be
    volumes:
      - ${DATA_DIR:-/opt/budokan/budokan-data}/uploads:/app/uploads
    # A imagem e node:20-slim (sem curl) e o app nao expoe rota de saude, entao a
    # prova disponivel e TCP: 8001 aceita conexao? O `nc` ja esta na imagem, instalado
    # para o wait_for_database do start.sh.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8001 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # start.sh espera o MySQL e roda drizzle-kit push antes de abrir o servidor
      start_period: 180s

  mysql:
    image: mysql:8.2
    container_name: budokan-be-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Banco so fala com o app pela rede budokan-network; nada e publicado.
    volumes:
      - ${DATA_DIR:-/opt/budokan/budokan-data}/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - budokan-network

networks:
  budokan-network:
    driver: bridge
  swag_default:
    external: true
